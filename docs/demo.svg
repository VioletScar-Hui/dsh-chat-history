<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- header -->
  <text x="640" y="52" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">dsh-chat-history — 像 shell 一样，用 ↑ / ↓ 翻历史消息</text>

  <!-- ============ LEFT PANEL : 发送 ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="96" width="560" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  </g>
  <text x="340" y="134" text-anchor="middle" fill="#8b949e" font-size="15">① 正常输入并发送</text>

  <!-- chat messages -->
  <g>
    <rect x="88" y="158" width="230" height="40" rx="10" fill="#30363d"/>
    <text x="104" y="183" fill="#e6edf3" font-size="14">帮我写个正则提取邮箱</text>
    <rect x="360" y="214" width="232" height="40" rx="10" fill="#21262d"/>
    <text x="376" y="239" fill="#c9d1d9" font-size="14">好的，[\w.+-]+@[\w-]+\.[\w.-]+</text>
    <rect x="88" y="270" width="196" height="40" rx="10" fill="#30363d"/>
    <text x="104" y="295" fill="#e6edf3" font-size="14">改成允许中文域名</text>
    <rect x="360" y="326" width="196" height="40" rx="10" fill="#21262d"/>
    <text x="376" y="351" fill="#c9d1d9" font-size="14">加上 [\u4e00-\u9fff] 即可</text>
  </g>

  <!-- input box (left) -->
  <rect x="88" y="384" width="504" height="52" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="104" y="416" fill="#e6edf3" font-size="15">新消息…</text>
  <rect x="520" y="396" width="56" height="28" rx="8" fill="#238636"/>
  <text x="548" y="415" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">发送</text>

  <!-- ============ RIGHT PANEL : 召回 ============ -->
  <g filter="url(#shadow)">
    <rect x="660" y="96" width="560" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  </g>
  <text x="940" y="134" text-anchor="middle" fill="#8b949e" font-size="15">② 光标在行首按 ↑，逐条召回</text>

  <!-- key badge ↑ -->
  <g>
    <rect x="796" y="150" width="44" height="44" rx="8" fill="#1f6feb"/>
    <text x="818" y="179" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">↑</text>
    <text x="856" y="178" fill="#8b949e" font-size="14">上一条</text>
    <rect x="976" y="150" width="44" height="44" rx="8" fill="#30363d" stroke="#8b949e"/>
    <text x="998" y="179" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">↓</text>
    <text x="1036" y="178" fill="#8b949e" font-size="14">下一条 / 还原草稿</text>
  </g>

  <!-- history popover mock -->
  <g>
    <rect x="688" y="214" width="504" height="40" rx="8" fill="#161b22"/>
    <text x="704" y="239" fill="#8b949e" font-size="14">已发送历史（本次会话）</text>
    <rect x="688" y="262" width="504" height="36" rx="8" fill="#1f242b"/>
    <text x="704" y="285" fill="#e6edf3" font-size="14">帮我写个正则提取邮箱</text>
    <rect x="688" y="306" width="504" height="36" rx="8" fill="#161b22"/>
    <text x="704" y="329" fill="#e6edf3" font-size="14">改成允许中文域名</text>
    <rect x="688" y="350" width="504" height="36" rx="8" fill="#161b22"/>
    <text x="704" y="373" fill="#8b949e" font-size="14">…</text>
  </g>

  <!-- input box (right, showing recalled) -->
  <rect x="688" y="384" width="504" height="52" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="704" y="416" fill="#e6edf3" font-size="15">改成允许中文域名</text>
  <text x="704" y="434" fill="#8b949e" font-size="11">▍ 光标停在末尾，可直接编辑</text>

  <!-- footer -->
  <text x="640" y="510" text-anchor="middle" fill="#8b949e" font-size="14">纯客户端 · 零配置 · 每会话独立 · 连续去重 · 上限 200 条 · 重启不丢</text>
</svg>
